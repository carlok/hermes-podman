# Retry drop-in for podman-restart.service — the fix for "the container did not come back
# after a real reboot" on Ubuntu 26.04 (documented in docs/BOOT.md, tested on 2026-10-10).
#
# What happens without it: at boot the vendor unit fires ~20 seconds after kernel start and
# podman's own re-exec fails there —
#
#   podman[1316]: failed to reexec: Permission denied
#   podman-restart.service: Main process exited, code=exited, status=1/FAILURE
#
# (Ubuntu loads AppArmor profiles progressively during boot and restricts unprivileged user
# namespaces: kernel.apparmor_restrict_unprivileged_userns=1. The same unit started a minute
# later succeeds, and `podman` works from an interactive shell in the same boot, so the
# environment simply is not ready yet.) Being Type=oneshot, the unit has no second attempt,
# and the container stays down until someone runs `make up`.
#
# Install (once per host, as your normal user):
#   mkdir -p ~/.config/systemd/user/podman-restart.service.d
#   cp deploy/podman-restart-retry.conf ~/.config/systemd/user/podman-restart.service.d/retry.conf
#   systemctl --user daemon-reload
#   systemctl --user reset-failed podman-restart.service
#
# Revert: delete the file and `systemctl --user daemon-reload`. Nothing else is changed and
# no sysctl/AppArmor setting is weakened — the retry only gives the same command more attempts.
[Service]
ExecStart=
ExecStart=/bin/bash -c 'for i in $(seq 1 30); do /usr/bin/podman --log-level=info start --all --filter restart-policy=always && exit 0; sleep 4; done; echo "podman-restart: gave up after 30 attempts"; exit 1'
